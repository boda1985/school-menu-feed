name: Update school menu feed

on:
  schedule:
    - cron: "17 11 * * *"   # daily ~5:17am Mountain (catches menu changes)
  workflow_dispatch:         # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ICS
        run: python schoolcafe_to_ics.py
        env:
          TZ: America/Denver
      - name: Commit if changed
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add docs/menu.ics
          git diff --cached --quiet || git commit -m "Update menu $(date +%F)"
          git push
